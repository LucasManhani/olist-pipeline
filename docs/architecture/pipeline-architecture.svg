<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do Olist Data Pipeline</title>
  <desc id="description">Arquivos CSV da Olist são carregados por Python no schema raw do PostgreSQL. O dbt transforma os dados nas camadas bronze, silver e gold. Airflow e Docker Compose orquestram o fluxo localmente, enquanto o pgAdmin permite inspeção.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <style>
      .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #667085; }
      .node-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #172033; }
      .node-subtitle { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #344054; }
      .node-detail { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #667085; }
      .group-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #172033; }
      .layer-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #172033; }
      .layer-detail { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #667085; }
      .flow-label { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #475467; }
      .task-text { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #344054; }
    </style>
  </defs>

