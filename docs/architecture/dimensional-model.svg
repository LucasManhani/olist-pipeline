    <rect x="1200" y="509" width="295" height="78" rx="13" fill="#FFFBEB" stroke="#E8CF72" stroke-width="1.4"/>
    <rect x="1200" y="509" width="7" height="78" rx="3.5" fill="#D4A017"/>
