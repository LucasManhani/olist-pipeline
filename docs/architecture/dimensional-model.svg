<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Modelo dimensional do Olist Data Pipeline</title>
  <desc id="description">Quatro dimensões conformadas se relacionam com três tabelas fato na camada gold. A camada também contém cinco marts com métricas de negócio. Order ID é uma dimensão degenerada compartilhada pelas fatos.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <style>
      .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #667085; }
      .group-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #172033; }
      .card-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #172033; }
      .card-detail { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #667085; }
      .label { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #475467; }
      .note-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #172033; }
      .note-detail { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #667085; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="70" y="56" class="title">Modelo dimensional • camada Gold</text>
  <text x="70" y="86" class="subtitle">Dimensões conformadas • fatos por processo de negócio • marts analíticos</text>
  <circle cx="1280" cy="62" r="5" fill="#12B76A"/>
  <text x="1294" y="67" class="card-detail">Modelo implementado</text>

  <rect x="70" y="125" width="370" height="650" rx="20" fill="#FFFFFF" stroke="#B8C4D6" stroke-width="1.5"/>
  <circle cx="108" cy="165" r="18" fill="#EAF2FF"/>
  <path d="M 99 156 H 117 V 174 H 99 Z M 99 162 H 117 M 105 156 V 174 M 111 156 V 174" fill="none" stroke="#2563EB" stroke-width="1.8"/>
