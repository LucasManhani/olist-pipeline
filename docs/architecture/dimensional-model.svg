    <rect x="620" y="395" width="400" height="140" rx="16" fill="#FFFCF5" stroke="#E7C98A" stroke-width="1.5"/>
    <rect x="620" y="395" width="400" height="8" rx="4" fill="#B7791F"/>
    <circle cx="663" cy="455" r="24" fill="#FFF1D6"/>
    <path d="M 650 446 L 663 439 L 676 446 V 463 L 663 470 L 650 463 Z M 650 446 L 663 454 L 676 446 M 663 454 V 470" fill="none" stroke="#B7791F" stroke-width="2" stroke-linejoin="round"/>
