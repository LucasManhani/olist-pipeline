  <path d="M 405 265 C 500 265 500 465 610 465" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 405 265 C 490 265 500 665 610 665" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 405 385 C 505 385 500 285 610 285" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 405 385 C 500 385 500 685 610 685" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
