    <text x="648" y="686" class="card-detail">tipo • parcelas • valor pago</text>
  </g>

  <rect x="1165" y="125" width="365" height="650" rx="20" fill="#FFFFFF" stroke="#B8C4D6" stroke-width="1.5"/>
  <circle cx="1203" cy="165" r="18" fill="#FFF9DD"/>
  <path d="M 1194 174 V 163 M 1202 174 V 156 M 1210 174 V 160" stroke="#D4A017" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1233" y="171" class="group-title">Marts analíticos</text>

  <line x1="1065" y1="450" x2="1145" y2="450" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>
