    <text x="648" y="506" class="card-detail">produto • vendedor • preço • frete</text>

    <rect x="620" y="575" width="400" height="140" rx="16" fill="#FFFCF5" stroke="#E7C98A" stroke-width="1.5"/>
    <rect x="620" y="575" width="400" height="8" rx="4" fill="#B7791F"/>
    <circle cx="663" cy="635" r="24" fill="#FFF1D6"/>
