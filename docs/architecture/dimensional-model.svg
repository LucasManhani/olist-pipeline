  <rect x="70" y="810" width="1460" height="58" rx="16" fill="#EEF4FF" stroke="#A7C5F9" stroke-width="1.3"/>
  <circle cx="103" cy="839" r="15" fill="#2563EB"/>
  <text x="103" y="844" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#FFFFFF">i</text>
  <text x="130" y="836" class="note-title">order_id como dimensão degenerada</text>
  <text x="130" y="855" class="note-detail">Chave de negócio compartilhada para rastreabilidade; não representa um relacionamento analítico direto entre fatos de granularidades diferentes.</text>
</svg>
